<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTROWEN STORE | Elite Digital Hub</title>
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #00e5ff;
            --dark: #0a0f1d;
            --card-bg: #141b2d;
            --text: #ffffff;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-placeholder {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #222d42;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--secondary);
            border-bottom: 2px solid #222d42;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #0b111e;
            border: 1px solid #2c3a57;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--primary), #cc0044);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #resultado-nick {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            min-height: 24px;
        }

        .badge-info {
            background-color: #1e293b;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-placeholder">🐐</div>
        <h1>Owen Store FF</h1>
        <p>Elite Digital Hub - Diamantes Ilimitados Automatizados</p>
    </header>

    <div class="container">
        <!-- SECCIÓN 1: VALIDACIÓN DEL ID DE JUGADOR -->
        <div class="card">
            <h2>1. Verificación de Cuenta</h2>
            <div class="form-group">
                <label for="player-id">ID de Free Fire del Jugador:</label>
                <input type="text" id="player-id" placeholder="Ej: 2670789891" autocomplete="off">
            </div>
            <button id="btn-verificar">Validar Jugador</button>
            <div id="resultado-nick">Escribe tu ID para ver el nombre de tu cuenta.</div>
        </div>

        <!-- SECCIÓN 2: SELECCIÓN Y PROCESAMIENTO DE COMPRA -->
        <div class="card">
            <h2>2. Procesar Recarga Automática</h2>
            <div class="form-group">
                <label for="product-id">Paquete de Diamantes Ilimitados:</label>
                <select id="product-id">
                    <!-- Recuerda mapear el value de la opción con el ID real del producto en tu distribuidor -->
                    <option value="4">Paquete Diamantes Ilimitados (ID: 4)</option>
                </select>
            </div>
            <button id="btn-comprar">Enviar Pedido Automático</button>
            <div class="badge-info">
                Al presionar el botón, el sistema enviará la recarga de forma directa y registrará la orden en tu base de datos D1.
            </div>
        </div>
    </div>

    <!-- CONTROLADORES Y AUTOMATIZACIÓN DE LAS APIS -->
    <script>
        // CONFIGURACIÓN DE TU BACKEND
        // Reemplaza esta URL con la ruta de producción real de tu Cloudflare Worker sin la barra final (/)
        const WORKER_URL = "https://workers.dev"; 

        // CAPTURA DE COMPONENTES DEL DOM
        const inputId = document.getElementById("player-id");
        const btnVerificar = document.getElementById("btn-verificar");
        const txtResultado = document.getElementById("resultado-nick");
        
        const selectProducto = document.getElementById("product-id");
        const btnComprar = document.getElementById("btn-comprar");

        // --- ENLACE 1: VALIDACIÓN MEDIANTE VOLSEVER API ---
        if (btnVerificar) {
            btnVerificar.addEventListener("click", async (e) => {
                e.preventDefault();
                const playerId = inputId.value.trim();
                
                if (!playerId) {
                    alert("Por favor, ingresa un ID válido de Free Fire.");
                    return;
                }

                txtResultado.textContent = "Consultando en los servidores de Garena Pagostore...";
                txtResultado.style.color = "#ffaa00";
                btnVerificar.disabled = true;

                try {
                    const response = await fetch(`${WORKER_URL}/api/validate-player`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ player_id: playerId })
                    });

                    const resData = await response.json();

                    if (resData.success && resData.data && resData.data.success && resData.data.data.status) {
                        const accountName = resData.data.data.account_name;
                        txtResultado.textContent = `✅ Cuenta Encontrada: ${accountName}`;
                        txtResultado.style.color = "#00ff00";
                    } else {
                        txtResultado.textContent = "❌ No se pudo verificar: ID incorrecto o no existe en Garena.";
                        txtResultado.style.color = "#ff0000";
                    }
                } catch (error) {
                    console.error("Error al validar:", error);
                    txtResultado.textContent = "⚠️ Error de red o token administrativo inválido.";
                    txtResultado.style.color = "#ff0000";
                } finally {
                    btnVerificar.disabled = false;
                }
            });
        }

        // --- ENLACE 2: COMPRA AUTOMATIZADA MEDIANTE RECARGASAMÉRICA API ---
        if (btnComprar) {
            btnComprar.addEventListener("click", async (e) => {
                e.preventDefault();
                const playerId = inputId.value.trim();
                const productId = selectProducto.value;

                if (!playerId) {
                    alert("Primero ingresa y valida el ID de Free Fire.");
                    return;
                }

                if (!confirm(`¿Confirmas que deseas enviar el paquete de diamantes al ID: ${playerId}?`)) {
                    return;
                }

                btnComprar.disabled = true;
                btnComprar.textContent = "Procesando recarga...";

                try {
                    const response = await fetch(`${WORKER_URL}/api/buy-diamonds`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            player_id: playerId,
                            product_id: parseInt(productId)
                        })
                    });

                    const compraResult = await response.json();

                    if (response.ok && compraResult.success) {
                        alert(`¡Recarga Completada Exitosamente!\nOrden ID: ${compraResult.data.order_id}\nMonto Debitado: $${compraResult.data.amount_charged}`);
                    } else {
                        if (response.status === 502 || compraResult.code === "PROVIDER_ERROR") {
                            alert("⚠️ Notificación: La orden se cobró pero entró en revisión asíncrona por el proveedor. Se reflejará en unos minutos.");
                        } else if (response.status === 409 || compraResult.code === "DUPLICATE_REQUEST") {
                            alert("❌ Error: Solicitud duplicada detectada. No vuelvas a pagar por la misma transacción.");
                        } else if (response.status === 422 || compraResult.code === "INVALID_PLAYER") {
