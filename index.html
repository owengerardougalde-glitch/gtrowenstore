<!-- ============================================================
  SECCIÓN: TOP CLIENTES PRIME  ·  GTROWEN STORE
  Pega TODO este bloque en tu index.html, justo antes de
  la sección del catálogo (o donde quieras que aparezca).
  Los datos se editan en el arreglo CLIENTES_PRIME (abajo).
============================================================ -->

<section id="clientes-prime" class="cp-section">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Bebas+Neue&display=swap');

    .cp-section{
      --cp-bg:#0b0b12; --cp-card:#14141f; --cp-line:#2a2a3d;
      --cp-orange:#ff7a18; --cp-gold:#ffc83d; --cp-purple:#8b5cf6; --cp-text:#f2f2f7; --cp-mute:#9a9ab0;
      position:relative; overflow:hidden; padding:48px 16px 56px; margin:32px 0;
      background:
        radial-gradient(600px 300px at 15% 0%, rgba(255,122,24,.18), transparent 70%),
        radial-gradient(600px 300px at 90% 10%, rgba(139,92,246,.18), transparent 70%),
        var(--cp-bg);
      border-top:1px solid var(--cp-line); border-bottom:1px solid var(--cp-line);
      font-family:'Rajdhani',system-ui,sans-serif; color:var(--cp-text);
    }
    .cp-wrap{max-width:980px;margin:0 auto}
    .cp-head{text-align:center;margin-bottom:28px}
    .cp-kicker{display:inline-block;padding:4px 14px;border:1px solid rgba(255,200,61,.5);border-radius:999px;
      color:var(--cp-gold);font-weight:700;letter-spacing:.18em;font-size:.78rem;text-transform:uppercase}
    .cp-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:.04em;margin:10px 0 4px;line-height:1;
      background:linear-gradient(90deg,#ffe08a,#ff7a18 55%,#ff3d54);-webkit-background-clip:text;background-clip:text;color:transparent}
    .cp-sub{color:var(--cp-mute);font-weight:500;font-size:1.05rem}

    /* ---- Totales ---- */
    .cp-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
    .cp-stat{position:relative;background:linear-gradient(160deg,#1a1a28,#101019);border:1px solid var(--cp-line);
      border-radius:16px;padding:16px 14px;text-align:center;overflow:hidden}
    .cp-stat::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:80%;
      background:radial-gradient(closest-side,rgba(255,122,24,.25),transparent);pointer-events:none}
    .cp-stat-ico{font-size:1.5rem}
    .cp-stat-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.9rem,7vw,2.8rem);letter-spacing:.03em;color:var(--cp-gold);line-height:1.1}
    .cp-stat-lbl{color:var(--cp-mute);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}

    /* ---- Lista ---- */
    .cp-list{display:grid;gap:12px;grid-template-columns:1fr}
    .cp-card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;
      background:var(--cp-card);border:1px solid var(--cp-line);border-radius:16px;padding:14px;
      transition:transform .2s,border-color .2s,box-shadow .2s}
    .cp-card:hover{transform:translateY(-2px);border-color:rgba(255,122,24,.6);box-shadow:0 8px 28px rgba(255,122,24,.12)}
    .cp-card.top1{border-color:rgba(255,200,61,.7);box-shadow:0 0 0 1px rgba(255,200,61,.25),0 10px 34px rgba(255,200,61,.14);
      background:linear-gradient(135deg,#1d1a12,#14141f 60%)}

    .cp-rank{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
      font-family:'Bebas Neue',sans-serif;font-size:1.5rem;background:#1d1d2c;border:1px solid var(--cp-line);color:var(--cp-mute)}
    .cp-card.top1 .cp-rank{background:linear-gradient(135deg,#ffe08a,#ff9f1c);color:#2b1b00;border:none}
    .cp-card.top2 .cp-rank{background:linear-gradient(135deg,#f1f1f6,#a9a9bd);color:#1d1d28;border:none}
    .cp-card.top3 .cp-rank{background:linear-gradient(135deg,#f6b37a,#c07038);color:#2b1400;border:none}

    .cp-info{min-width:0}
    .cp-name{font-weight:700;font-size:1.25rem;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cp-id{display:inline-flex;align-items:center;gap:6px;margin-top:3px;color:var(--cp-mute);font-weight:600;font-size:.92rem;
      cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
    .cp-id b{color:var(--cp-text);font-variant-numeric:tabular-nums;letter-spacing:.03em}
    .cp-id:active{opacity:.7}

    .cp-meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
    .cp-prime{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:700;
      letter-spacing:.08em;font-size:.85rem;text-transform:uppercase;border:1px solid transparent}
    .cp-prime.p-low{background:#242434;color:#c9c9dc;border-color:#34344a}
    .cp-prime.p-mid{background:rgba(59,130,246,.15);color:#8db8ff;border-color:rgba(59,130,246,.5)}
    .cp-prime.p-high{background:rgba(139,92,246,.18);color:#c4a8ff;border-color:rgba(139,92,246,.6)}
    .cp-prime.p-max{background:linear-gradient(110deg,#ffd35c,#ff8a1c,#ffd35c);background-size:200% 100%;color:#2b1700;
      animation:cpShine 3s linear infinite;box-shadow:0 0 16px rgba(255,170,40,.45)}
    @keyframes cpShine{to{background-position:-200% 0}}

    .cp-chip{padding:5px 10px;border-radius:10px;background:#1b1b2a;border:1px solid var(--cp-line);font-weight:600;font-size:.92rem}
    .cp-chip b{color:var(--cp-gold)}
    .cp-bar{grid-column:1 / -1;height:6px;border-radius:99px;background:#1d1d2c;overflow:hidden}
    .cp-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff3d54,#ff7a18,#ffc83d);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}

    .cp-foot{margin-top:18px;text-align:center;color:var(--cp-mute);font-size:.9rem}
    .cp-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
      background:#1d1d2c;color:#fff;border:1px solid var(--cp-orange);padding:9px 16px;border-radius:12px;font-weight:600;transition:.25s;z-index:9999}
    .cp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media (min-width:700px){
      .cp-section{padding:64px 24px 72px}
      .cp-list{grid-template-columns:1fr 1fr}
      .cp-card.top1{grid-column:1 / -1}
    }
  </style>

  <div class="cp-wrap">
    <div class="cp-head">
      <span class="cp-kicker">🔥 Salón de la fama</span>
      <h2 class="cp-title">Clientes Prime que más recargan</h2>
      <p class="cp-sub">Los jugadores de Free Fire que más confían en GTROWEN STORE 🦇</p>
    </div>

    <div class="cp-stats">
      <div class="cp-stat">
        <div class="cp-stat-ico">💵</div>
        <div class="cp-stat-num" id="cpTotalUsd">$0</div>
        <div class="cp-stat-lbl">Dólares gastados en recargas</div>
      </div>
      <div class="cp-stat">
        <div class="cp-stat-ico">💎</div>
        <div class="cp-stat-num" id="cpTotalDia">0</div>
        <div class="cp-stat-lbl">Diamantes recargados</div>
      </div>
    </div>

    <div class="cp-list" id="cpList"></div>
    <p class="cp-foot">Toca un ID para copiarlo · Ranking por dólares gastados</p>
  </div>

  <div class="cp-toast" id="cpToast">ID copiado ✅</div>

  <script>
  (function(){
    /* =====================================================
       ✏️ EDITA AQUÍ A TUS CLIENTES (estos son datos de EJEMPLO)
       nombre   → nombre de la cuenta de Free Fire
       id       → ID de Free Fire (texto)
       prime    → nivel Prime de la cuenta (1 a 8)
       usd      → dólares gastados en total
       diamantes→ diamantes recargados en total
       ===================================================== */
    var CLIENTES_PRIME = [
      { nombre:"ShadowKing",   id:"1234567890", prime:8, usd:485.50, diamantes:52400 },
      { nombre:"NovaGamer_CR", id:"2345678901", prime:8, usd:362.00, diamantes:38900 },
      { nombre:"ElPatrón",     id:"3456789012", prime:7, usd:241.75, diamantes:25600 },
      { nombre:"LunaFF",       id:"4567890123", prime:6, usd:168.20, diamantes:17800 },
      { nombre:"Sniper_X",     id:"5678901234", prime:5, usd:96.40,  diamantes:10200 }
    ];

    var OCULTAR_PARTE_DEL_ID = false; // true → muestra 12••••7890 (más privado)

    var list = document.getElementById('cpList');
    var datos = CLIENTES_PRIME.slice().sort(function(a,b){ return b.usd - a.usd; });
    var maxUsd = datos.length ? datos[0].usd : 1;

    function fmt(n){ return Math.round(n).toLocaleString('es-CR'); }
    function money(n){ return '$' + n.toLocaleString('es-CR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function primeClass(p){ return p>=8?'p-max':p>=6?'p-high':p>=4?'p-mid':'p-low'; }
    function maskId(id){ return id.length>6 ? id.slice(0,2)+'••••'+id.slice(-4) : id; }
    function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

    datos.forEach(function(c, i){
      var card = el('article','cp-card' + (i<3 ? ' top'+(i+1) : ''));
      card.appendChild(el('div','cp-rank', '#'+(i+1)));

      var info = el('div','cp-info');
      info.appendChild(el('div','cp-name', c.nombre));
      var idBtn = el('button','cp-id');
      idBtn.type = 'button';
      idBtn.appendChild(document.createTextNode('ID '));
      idBtn.appendChild(el('b',null, OCULTAR_PARTE_DEL_ID ? maskId(c.id) : c.id));
      idBtn.appendChild(document.createTextNode(' 📋'));
      idBtn.addEventListener('click', function(){
        if(navigator.clipboard){ navigator.clipboard.writeText(c.id).catch(function(){}); }
        var t = document.getElementById('cpToast'); t.classList.add('show');
        setTimeout(function(){ t.classList.remove('show'); }, 1400);
      });
      info.appendChild(idBtn);
      card.appendChild(info);

      var meta = el('div','cp-meta');
      meta.appendChild(el('span','cp-prime '+primeClass(c.prime), '⭐ Prime '+c.prime));
      var u = el('span','cp-chip'); u.appendChild(document.createTextNode('💵 ')); u.appendChild(el('b',null,money(c.usd))); meta.appendChild(u);
      var d = el('span','cp-chip'); d.appendChild(document.createTextNode('💎 ')); d.appendChild(el('b',null,fmt(c.diamantes))); meta.appendChild(d);
      card.appendChild(meta);

      var bar = el('div','cp-bar'); var fill = document.createElement('i');
      fill.setAttribute('data-w', Math.max(6, Math.round(c.usd / maxUsd * 100)));
      bar.appendChild(fill); card.appendChild(bar);

      list.appendChild(card);
    });

    /* Totales con animación de conteo */
    var totUsd = datos.reduce(function(s,c){return s+c.usd;},0);
    var totDia = datos.reduce(function(s,c){return s+c.diamantes;},0);
    function countUp(id, target, formatter){
      var node = document.getElementById(id), t0 = null, dur = 1400;
      function step(ts){
        if(!t0) t0 = ts;
        var p = Math.min((ts - t0)/dur, 1), e = 1 - Math.pow(1-p, 3);
        node.textContent = formatter(target * e);
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function arrancar(){
      countUp('cpTotalUsd', totUsd, function(v){ return '$' + fmt(v); });
      countUp('cpTotalDia', totDia, fmt);
      list.querySelectorAll('.cp-bar i').forEach(function(f){ f.style.width = f.getAttribute('data-w') + '%'; });
    }
    var sec = document.getElementById('clientes-prime');
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(en){
        if(en[0].isIntersecting){ arrancar(); io.disconnect(); }
      }, {threshold:.2});
      io.observe(sec);
    } else { arrancar(); }
  })();
  </script>
</section>
