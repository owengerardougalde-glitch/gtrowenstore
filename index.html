<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTROWEN.STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03050b;
            --surface: #0b0e19;
            --surface-card: #121728;
            --primary: #00f0ff;
            --secondary: #ff0055;
            --purple: #7000ff;
            --gold: #ffb700;
            --ff-gold: #f9d342;
            --binance: #f3ba2f;
            --text: #ffffff;
            --text-dim: #8b92b0;
            --border: rgba(255, 0, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .samurai-watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 0;
            opacity: 0.15;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .samurai-svg-art {
            width: 650px;
            max-width: 95vw;
            height: auto;
            filter: drop-shadow(0 0 35px var(--secondary));
            pointer-events: none !important;
        }

        header {
            background: rgba(11, 14, 25, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 12px 18px;
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--secondary), var(--purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--secondary);
            letter-spacing: 1px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .brand-title span { color: var(--primary); }

        .brand-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .currency-switch {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px;
            display: flex;
            gap: 2px;
            overflow-x: auto;
            max-width: 220px;
        }

        .curr-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 4px 6px;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        .curr-btn.active {
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .header-cart {
            background: linear-gradient(135deg, rgba(112, 0, 255, 0.3), rgba(255, 0, 85, 0.3));
            border: 1px solid var(--secondary);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .header-cart-badge {
            background: var(--primary);
            color: #000;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 10;
        }

        .samurai-banner {
            background: linear-gradient(135deg, rgba(11, 14, 25, 0.95), rgba(18, 23, 40, 0.95));
            backdrop-filter: blur(8px);
            border: 2px solid var(--secondary);
            border-radius: 18px;
            padding: 20px 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1);
            position: relative;
            z-index: 5;
        }

        .samurai-header-content {
            text-align: center;
            margin-bottom: 18px;
        }

        .samurai-store-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--secondary);
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
            letter-spacing: 2px;
        }

        .samurai-store-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* BOTÓN PARA ABRIR TOP CLIENTES */
        .btn-open-top-clients {
            background: linear-gradient(135deg, rgba(255, 183, 0, 0.15), rgba(11, 14, 25, 0.9));
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.2);
            transition: all 0.3s ease;
        }
        .btn-open-top-clients:active { transform: scale(0.98); }

        .samurai-box-catalog {
            border: 1px solid var(--primary);
            border-radius: 12px;
            background: rgba(0, 240, 255, 0.04);
            padding: 14px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .samurai-box-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 900;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .samurai-catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        @media (max-width: 500px) { .samurai-catalog-grid { grid-template-columns: 1fr; } }

        .samurai-item-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            cursor: pointer;
        }

        .samurai-item-pill:hover {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .cat-btn {
            background: rgba(11, 14, 25, 0.95);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active {
            background: linear-gradient(135deg, var(--secondary), var(--purple));
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .product-card {
            background: rgba(18, 23, 40, 0.95);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-badge { font-size: 0.68rem; font-weight: 700; color: var(--secondary); margin-bottom: 6px; }
        .product-name { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .product-price { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: var(--primary); font-weight: 700; margin-bottom: 12px; }

        .btn-add {
            background: linear-gradient(135deg, var(--purple), var(--secondary));
            color: #fff; border: none; border-radius: 8px; padding: 10px 0; font-weight: 700; font-size: 0.75rem; font-family: 'Orbitron', sans-serif; cursor: pointer; width: 100%; text-transform: uppercase;
        }

        .floating-cart-btn {
            position: fixed; bottom: 85px; right: 20px; background: linear-gradient(135deg, var(--purple), var(--secondary)); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 12px 20px; border-radius: 30px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); z-index: 1000;
        }

        .floating-whatsapp-btn {
            position: fixed; bottom: 20px; left: 20px; background: #25d366; color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); width: 52px; height: 52px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(37, 211, 102, 0.5); z-index: 1000;
        }

        .floating-cart-badge {
            background: #fff; color: #000; font-size: 0.75rem; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 15px;
        }
        .modal.open { display: flex; }
        .modal-box {
            background: var(--surface); border: 1px solid var(--primary); border-radius: 16px; width: 100%; max-width: 420px; padding: 20px; max-height: 85vh; overflow-y: auto; position: relative; z-index: 2001;
        }
        .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-top h3 { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: var(--primary); }
        .btn-close { background: none; border: none; color: var(--text-dim); font-size: 1.4rem; cursor: pointer; z-index: 2010; }

        .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        .cart-total-box { display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron', sans-serif; font-size: 1.05rem; color: var(--primary); margin: 15px 0; padding-top: 10px; border-top: 1px solid var(--border); font-weight: 700; }
        .input-box { margin-bottom: 12px; }
        .input-box label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
        .input-box input, .input-box select { width: 100%; padding: 10px; background: var(--surface-card); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }
        .info-pay { background: rgba(0, 240, 255, 0.05); border: 1px dashed var(--primary); border-radius: 8px; padding: 12px; font-size: 0.8rem; margin-bottom: 15px; line-height: 1.5; }
        .btn-proceed { background: linear-gradient(135deg, var(--secondary), var(--purple)); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.85rem; cursor: pointer; }
        .btn-send { background: #25d366; color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.85rem; cursor: pointer; }

        /* ---------------------------------------------------
           DISEÑO DEL MODAL: FONDO COMPLETO DE FREE FIRE
           --------------------------------------------------- */
        
        #topClientsModal .modal-box {
            background: #000;
            border: 2px solid var(--ff-gold);
            box-shadow: 0 0 30px rgba(249, 211, 66, 0.3);
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 450px;
        }

        #topClientsModal .modal-top {
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid var(--ff-gold);
            padding: 15px;
            margin-bottom: 0;
            position: relative;
            z-index: 10;
        }

        #topClientsModal .modal-top h3 {
            color: var(--ff-gold);
            text-shadow: 0 0 10px rgba(249, 211, 66, 0.5);
            letter-spacing: 1px;
        }

        .ff-lobby-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* ESTA ES LA IMAGEN DE FONDO. CUBRE TODO EL ESPACIO */
        .ff-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Un filtro oscuro encima de tu foto para que las letras se lean bien */
        .ff-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
        }

        /* Contenedor del contenido flotante (Stats, nombre, etc) */
        .ff-content {
            position: relative;
            z-index: 3;
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* La tarjeta del jugador (Arriba a la derecha) */
        .ff-player-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--ff-gold);
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            align-self: flex-end;
            backdrop-filter: blur(5px);
        }

        .ff-player-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(249, 211, 66, 0.3);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .ff-avatar {
            width: 35px;
            height: 35px;
            background: #111;
            border: 1px solid var(--ff-gold);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ff-name-level { text-align: right; }
        .ff-name { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; color: #fff; text-transform: uppercase; }
        .ff-level { font-size: 0.65rem; color: var(--ff-gold); font-weight: bold; }
        .ff-uid { font-size: 0.7rem; color: var(--text-dim); }

        /* Estadísticas (Abajo a la izquierda) */
        .ff-stats-box {
            background: rgba(0, 0, 0, 0.75);
            border-left: 3px solid var(--primary);
            padding: 8px 12px;
            align-self: flex-start;
            backdrop-filter: blur(5px);
            margin-bottom: 10px;
        }

        .ff-stat-title { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .ff-stat-value { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; color: var(--primary); text-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }

        .css-ff-logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 10px; color: #ffaa00; text-shadow: 1px 1px 0px #ff0055; line-height: 1; text-align: center; }
    </style>
</head>
<body>

    <!-- Header y Banner principal (Oculté partes largas del catálogo para que copies rápido el modal) -->
    <header>
        <div class="brand-box">
            <div class="brand-icon">🥷</div>
            <div class="brand-text">
                <div class="brand-title">GTROWEN <span>STORE</span></div>
                <div class="brand-sub">UDC DIGITAL</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="currency-switch"><button class="curr-btn active" data-curr="CRC">CRC</button></div>
            <div class="header-cart" id="openCartHeader"><span>🛒</span><span class="header-cart-badge cart-count">0</span></div>
        </div>
    </header>

    <div class="container">
        <div class="samurai-banner">
            <div class="samurai-header-content">
                <div class="samurai-store-name">GTROWEN.STORE</div>
                <div class="samurai-store-sub">🥷 VENTA DE SERVICIOS DIGITALES 🥷</div>
            </div>

            <!-- BOTÓN QUE ABRE LA "PESTAÑITA" DE LOS MEJORES CLIENTES SIN ESTORBAR -->
            <button class="btn-open-top-clients" id="btnOpenTopClients">
                🏆 VER TOP CLIENTES PRIME 👑
            </button>
        </div>
        
        <div class="section-h2" id="catalogTitle">🔥 CATALOGO GENERAL</div>
        <div class="products-grid" id="productsGrid">
            <!-- (Aquí van todos tus productos del catálogo que ya tenías) -->
             <div class="product-card" data-cat="ff-ilim" data-crc="35500" data-usd="66.00" data-mxn="1150" data-cop="350000" data-ars="65000" data-pen="265.00">
                <div>
                    <div class="product-badge" style="color:var(--gold);">💎 Free Fire (Mega Pack)</div>
                    <div class="product-name">💎 12,343 Diamantes (ID: 301110819)</div>
                </div>
                <div>
                    <div class="product-price price-tag">₡35,500</div>
                    <button class="btn-add" data-title="12,343 Diamantes FF" data-crc="35500" data-usd="66.00" data-mxn="1150" data-cop="350000" data-ars="65000" data-pen="265.00">Agregar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL SECUNDARIO: PESTAÑITA DE TOP CLIENTES PRIME (ESTILO LOBBY FF) -->
    <div class="modal" id="topClientsModal">
        <div class="modal-box">
            <div class="modal-top">
                <h3>🏆 TOP CLIENTES PRIME</h3>
                <button class="btn-close" id="closeTopClientsBtn">&times;</button>
            </div>

            <div class="ff-lobby-container">
                
                <!-- MAE, AQUI ESTA LA IMAGEN DE FONDO. 
                     Borra el link de placehold.co y PEGA EL LINK DE TU FOTO SUBIDA A INTERNET -->
                <img src="https://placehold.co/600x400/0d0d0d/ffb700?text=PON+AQUI+EL+LINK+DE+TU+FOTO" alt="Fondo Free Fire" class="ff-bg-image">
                
                <!-- Esto oscurece un poco los bordes para que se lean las letras -->
                <div class="ff-overlay"></div>

                <!-- Contenido que flota sobre tu imagen -->
                <div class="ff-content">
                    
                    <div class="ff-player-card">
                        <div class="ff-player-header">
                            <div class="ff-name-level">
                                <div class="ff-name">J.C.</div>
                                <div class="ff-level">Nv. 75</div>
                            </div>
                            <div class="ff-avatar"><span class="css-ff-logo">FREE<br>FIRE</span></div>
                        </div>
                        <div class="ff-uid">UID: 301110819</div>
                    </div>

                    <div class="ff-stats-box">
                        <div class="ff-stat-title">COMPRAS TOTALES</div>
                        <div class="ff-stat-value">12,343 💎</div>
                        <div style="font-size: 0.6rem; color: var(--gold); margin-top: 2px;">TOP #1 PRIME ⚡</div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Logica basica de abrir/cerrar el modal del lobby
            document.getElementById('btnOpenTopClients').addEventListener('click', () => {
                document.getElementById('topClientsModal').classList.add('open');
            });
            document.getElementById('closeTopClientsBtn').addEventListener('click', () => {
                document.getElementById('topClientsModal').classList.remove('open');
            });
        });
    </script>
</body>
</html>
