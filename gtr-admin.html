<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>GTR STORE · Panel privado</title><style>body{font:16px system-ui;background:#090b14;color:#fff;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}input,button{padding:12px;border-radius:10px;border:1px solid #333;background:#171b2a;color:white}button{cursor:pointer;background:#713cff;border:0;font-weight:700;margin:3px 3px 3px 0}button.g{background:#2a3050}button.r{background:#a8243a}.card{background:#141827;border:1px solid #30364a;border-radius:14px;padding:14px;margin:12px 0}.muted{color:#aab1c5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:200px}.tag{color:#ffc857;font-weight:700}.error{color:#ff7777}.ok{color:#7dffb5}p{margin:6px 0}small{color:#aab1c5}pre{white-space:pre-wrap;font-size:.8rem}</style></head><body><main class="wrap"><h1>GTR STORE · Administración</h1><p class="muted">Panel privado. Confirma el pago en tu banco antes de entregar.</p>
<div class="card"><label>Clave administrativa<br><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN" style="width:min(100%,420px);margin-top:8px"></label> <button id="load">Entrar / Actualizar</button><br><button class="g" id="wal">Saldo en Central One</button><button class="g" id="cat">Ver productos Central One</button> <button id="bnt" class="g">Probar Binance</button> <button id="bnr" class="g">Revisar pagos Binance</button></div>
<div class="card"><h2 style="margin:0 0 8px">💰 Saldo de clientes</h2><p class="muted">Cuando un cliente te pague, súmale saldo aquí. La primera vez sale un PIN: mándaselo por WhatsApp.</p>
<div class="row"><input id="awU" placeholder="Usuario del cliente"><input id="awA" type="number" inputmode="decimal" step="0.01" placeholder="Monto en USD"></div>
<div class="row" style="margin-top:8px"><input id="awN" placeholder="Nota (ej. SINPE 5000)"></div>
<button id="awGo">Acreditar saldo</button><button class="g" id="awList">Ver saldos</button><button class="g" id="awRev">Compras con saldo</button>
<div id="awOut" class="muted" style="margin-top:8px"></div><div id="awRes"></div></div><div id="msg" class="muted"></div><div id="orders"></div></main><script>
const API='https://gtr-recargas-america.anonimoustugfa.workers.dev';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{$('token').value=localStorage.getItem('gtr_ord_tok')||''}catch(e){}
const ST={PENDING_PAYMENT:'⏳ Esperando tu confirmación de pago',PROCESSING:'⚙️ Procesando',PROCESSING_PROVIDER:'🕓 El proveedor lo está procesando',ERROR:'❌ Rechazado (se puede reintentar)',NEEDS_REVIEW:'⚠️ Requiere revisión (NO reintentar)',ARCHIVED:'🗂️ Quitado de la lista'};
const IT={PENDING:'pendiente',COMPLETED:'entregado',PROCESSING_PROVIDER:'procesando',REJECTED:'rechazado',REVIEW:'revisar',REFUNDED:'reembolsado'};
function tk(){return $('token').value.trim()}
async function call(path,method){const r=await fetch(API+path,{method:method||'GET',headers:{Authorization:'Bearer '+tk()}});const d=await r.json().catch(()=>({}));return {r,d}}
async function load(){if(!tk()){$('msg').textContent='Escribe tu clave.';return}try{localStorage.setItem('gtr_ord_tok',tk())}catch(e){}
 $('msg').textContent='Consultando pedidos…';
 try{const {r,d}=await call('/admin/orders');if(!r.ok||!d.success)throw Error(d.error||'No se pudo cargar');
  $('orders').innerHTML=(d.orders||[]).map(o=>`<article class="card"><div class="row"><b>${esc(o.order_id)}</b><span class="tag">${esc(ST[o.status]||o.status)}</span></div>
  <p>Cliente: ${esc(o.customer_name)} · ${esc(o.customer_phone)}</p><p>ID Free Fire: <b>${esc(o.player_id)}</b> ${o.player_name?'· '+esc(o.player_name):''}</p>
  <p>Pago: ${esc(o.payment_method)} · Referencia: ${esc(o.payment_reference)}</p><p>Total reportado: ${esc(o.display_total)} ${esc(o.currency)}</p>
  <p>Productos:</p>${o.items.map(x=>`<p style="margin-left:10px">• ${esc(x.name)} <small>→ Central One: ${esc(x.ra_name)}${x.ra_cost!=null?' · costo $'+esc(x.ra_cost):''} · ${esc(IT[x.state]||x.state)}${x.error?' · '+esc(x.error):''}</small></p>`).join('')}
  ${['PENDING_PAYMENT'].includes(o.status)?`<button data-a="deliver" data-id="${esc(o.order_id)}">Confirmar pago y entregar</button>`:''}
  ${o.status==='ERROR'?`<button data-a="deliver" data-id="${esc(o.order_id)}">Reintentar entrega</button>`:''}
  ${['PROCESSING','PROCESSING_PROVIDER','NEEDS_REVIEW'].includes(o.status)?`<button class="g" data-a="check" data-id="${esc(o.order_id)}">Consultar a Central One</button>`:''}
  ${['PENDING_PAYMENT','ERROR'].includes(o.status)?`<button class="r" data-a="cancel" data-id="${esc(o.order_id)}">Cancelar pedido</button>`:''}
  <button class="r" data-a="archive" data-id="${esc(o.order_id)}">Quitar de la lista</button>
  ${o.status==='NEEDS_REVIEW'?'<p class="error">No lo reintentes: puede estar cobrado. Revisa en el panel de Central One (Pedidos) antes de decidir.</p>':''}</article>`).join('')||'<div class="card">No hay pedidos pendientes.</div>';
  $('msg').textContent='Pedidos cargados.'}catch(e){$('msg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
$('load').onclick=load;
$('bnt').onclick=async()=>{$('msg').textContent='Probando Binance…';const {d}=await call('/a/binance-test');$('msg').innerHTML='<div class="card"><b>'+(d.ok?'<span class="ok">Binance responde bien</span>':'<span class="error">Binance NO responde bien</span>')+'</b><pre style="white-space:pre-wrap">'+esc(JSON.stringify(d,null,1))+'</pre></div>'};
$('bnr').onclick=async()=>{$('msg').textContent='Revisando pagos…';const {d}=await call('/a/binance-run');$('msg').innerHTML='<div class="card"><b>Revisión de pagos Binance</b><pre style="white-space:pre-wrap">'+esc(JSON.stringify(d,null,1))+'</pre></div>'};
$('wal').onclick=async()=>{const {d}=await call('/admin/wallet');$('msg').innerHTML=d.data?'Saldo en Central One: <b class="ok">'+esc(d.data.balance)+' '+esc(d.data.currency||'USD')+'</b>':'<span class="error">No se pudo consultar el saldo.</span>'};
$('cat').onclick=async()=>{const {d}=await call('/admin/catalog');if(!d.success){$('msg').innerHTML='<span class="error">No se pudo cargar.</span>';return}
 const map=d.map||{};$('msg').innerHTML='<div class="card"><b>En uso por la tienda:</b><pre>'+esc(Object.entries(map).map(([k,v])=>{const p=(d.products||[]).find(x=>x.id==v);return k+' → '+v+' · '+(p?p.name+' · costo $'+p.cost:'NO EXISTE')}).join('\n'))+'</pre><b>Catálogo:</b><pre>'+esc((d.products||[]).map(p=>p.id+' | '+p.sku+' | '+p.name+' | $'+p.cost).join('\n'))+'</pre></div>'};
$('orders').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 const q={deliver:'¿Confirmaste que el dinero ya llegó? Esto enviará la recarga al ID del cliente.',cancel:'¿Cancelar este pedido?',archive:'¿Quitar este pedido de la lista? No se borra nada del cliente ni de Central One, solo deja de aparecer aquí. Hazlo solo si ya lo entregaste o ya lo revisaste.',check:''}[a];if(q&&!confirm(q))return;
 b.disabled=true;const t=b.textContent;b.textContent='Procesando…';
 try{const {r,d}=await call('/admin/orders/'+encodeURIComponent(id)+'/'+a,'POST');if(!r.ok&&!d.status)throw Error(d.error||'Error');alert((a==='deliver'?'Resultado: ':'Estado: ')+(ST[d.status]||d.status||d.error)+(d.items?'\n'+d.items.map(i=>i.sku+': '+(IT[i.state]||i.state)+(i.error?' ('+i.error+')':'')).join('\n'):''));}
 catch(err){alert('No se pudo: '+err.message)}
 await load()};

async function adm(path,body){const r=await fetch(API+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+tk(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));return {r,d}}
$('awGo').onclick=async()=>{const u=$('awU').value.trim(),a=parseFloat($('awA').value);if(!u||!a){$('awOut').textContent='Escribe el usuario y el monto.';return}
 $('awOut').textContent='Acreditando…';const {d}=await adm('/a/credit',{u,usd:a,note:$('awN').value});
 if(!d.ok){$('awOut').innerHTML='<span class="error">'+esc(d.message||d.error||'Error')+'</span>';return}
 $('awOut').innerHTML='<span class="ok">✅ '+esc(d.u)+' ahora tiene $'+Number(d.balance).toFixed(2)+'</span>'+(d.pin?'<br><b>PIN NUEVO: '+esc(d.pin)+'</b> — mándaselo por WhatsApp (no se vuelve a mostrar)':'');$('awA').value='';$('awN').value=''};
$('awList').onclick=async()=>{const {d}=await adm('/a/wallets');$('awRes').innerHTML=(d.wallets||[]).map(w=>`<p><b>${esc(w.u)}</b> · $${Number(w.balance).toFixed(2)} <button class="g" data-pin="${esc(w.u)}">Nuevo PIN</button></p>`).join('')||'<p class="muted">Nadie tiene saldo todavía.</p>'};
$('awRev').onclick=async()=>{const {d}=await adm('/a/recent');$('awRes').innerHTML=(d.orders||[]).map(o=>`<p>${esc(o.u)} · ${esc(o.code)} · $${Number(o.price).toFixed(2)} · <b>${esc(o.status)}</b> · ID ${esc(o.ff_id)}${['review','pending','processing'].includes(o.status)?` <button class="g" data-chk="${esc(o.id)}">Consultar</button> <button class="r" data-ref="${esc(o.id)}">Devolver saldo</button>`:''}</p>`).join('')||'<p class="muted">Sin compras todavía.</p>'};
$('awRes').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.pin){if(!confirm('¿Generar un PIN nuevo para '+b.dataset.pin+'?'))return;const {d}=await adm('/a/reset-pin',{u:b.dataset.pin});$('awOut').innerHTML=d.ok?'PIN nuevo de '+esc(d.u)+': <b>'+esc(d.pin)+'</b>':'<span class="error">No se pudo.</span>'}
 if(b.dataset.chk){const {d}=await adm('/a/order-check',{id:b.dataset.chk});$('awOut').textContent=d.order?'Estado ahora: '+d.order.status:'No se pudo consultar.';$('awRev').click()}
 if(b.dataset.ref){if(!confirm('¿Devolver el saldo? Hazlo solo si Central One confirmó que NO se entregó.'))return;const {d}=await adm('/a/refund',{id:b.dataset.ref});$('awOut').textContent=d.message||'Listo';$('awRev').click()}};
if(tk())load();
</script></body></html>
